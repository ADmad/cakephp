name: CakePHP CI

on: [pull_request]

jobs:
  testsuite:
    runs-on: ubuntu-18.04
    strategy:
      matrix:
        php-versions: ['7.2', '7.3']
    name: Testsuite on PHP ${{ matrix.php-versions }}

    steps:
    - uses: actions/checkout@v1
      with:
        fetch-depth: 1

    - name: Setup PHP
      run: |
        # Without removing php-fpm extensions installation fails for some reason
        sudo apt remove php7.2-fpm
        sudo apt install php7.2-intl
        sudo update-alternatives --set php /usr/bin/php7.2
        sudo update-alternatives --set phar /usr/bin/phar7.2
        sudo update-alternatives --set phar.phar /usr/bin/phar.phar7.2
        sudo phpdismod xdebug

    - name: composer install
      run: composer install

    - name: Run PHPUnit
      run: vendor/bin/phpunit

  coding-standard:
    name: Coding Standard
    runs-on: ubuntu-18.04

    steps:
    - uses: actions/checkout@v1
      with:
        fetch-depth: 1

    - name: Setup PHP
      run: |
        # Without removing php-fpm extensions installation fails for some reason
        sudo apt remove php7.2-fpm
        sudo apt install php7.2-intl
        sudo update-alternatives --set php /usr/bin/php7.2
        sudo update-alternatives --set phar /usr/bin/phar7.2
        sudo update-alternatives --set phar.phar /usr/bin/phar.phar7.2
        sudo phpdismod xdebug

    - name: composer install
      run: composer stan-setup

    - name: Run PHP CodeSniffer
      run: composer cs-check

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-18.04

    steps:
    - uses: actions/checkout@v1
      with:
        fetch-depth: 1

    - name: Setup PHP
      run: |
        # Without removing php-fpm extensions installation fails for some reason
        sudo apt remove php7.2-fpm
        sudo apt install php7.2-intl
        sudo update-alternatives --set php /usr/bin/php7.2
        sudo update-alternatives --set phar /usr/bin/phar7.2
        sudo update-alternatives --set phar.phar /usr/bin/phar.phar7.2
        sudo phpdismod xdebug

    - name: composer install
      run: composer stan-setup

    - name: Run psalm
      run: vendor/bin/psalm.phar --show-info=false

    - name: Run phpstan
      run: vendor/bin/phpstan.phar analyse src/
